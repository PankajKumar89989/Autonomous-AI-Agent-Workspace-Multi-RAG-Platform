# Full stack: PostgreSQL, Redis, API, background worker and web app.
#   docker compose up --build          (also loads docker-compose.override.yml, which publishes ports on localhost)
# Production: see docker-compose.prod.yml and docs/deployment.md.
name: ai-agent-workspace

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_workspace
  REDIS_URL: redis://redis:6379/0
  UPLOAD_DIR: /app/uploads

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ai_workspace
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_workspace"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    command: ["api"]
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    volumes: [uploads:/app/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: ./backend
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    volumes: [uploads:/app/uploads]
    depends_on:
      backend: { condition: service_healthy }  # the API container applies the migrations first
    healthcheck:
      test: ["CMD-SHELL", "arq --check app.workers.tasks.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
  redisdata:
  uploads:
