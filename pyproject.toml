[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006", "B008"]
ignore = ["E731"]  # short lambdas in tests

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]  # FastAPI's Depends() in defaults is the framework's idiom
"alembic/**" = ["F401"]
"tests/conftest.py" = ["F401"]
